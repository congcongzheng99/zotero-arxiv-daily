# Modified 2026-10-30: persistent paper vectors; AGPL-3.0.
name: Send emails daily
'on':
  workflow_dispatch:
  schedule:
    # 00:30 US Eastern, Monday-Friday; follows daylight saving time.
    - cron: '30 0 * * 1-5'
      timezone: 'America/New_York'

# Serialize Test and daily runs on the same branch to share the latest vectors.
concurrency:
  group: zotero-arxiv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Restore paper embedding vectors
        id: embedding_cache_restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .cache/paper-embeddings/vectors.sqlite3
          key: paper-embeddings-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            paper-embeddings-v1-${{ runner.os }}-

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Save updated paper embedding vectors
        if: ${{ always() && hashFiles('.cache/paper-embeddings/.updated') != '' && hashFiles('.cache/paper-embeddings/vectors.sqlite3') != '' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/paper-embeddings/vectors.sqlite3
          key: ${{ steps.embedding_cache_restore.outputs.cache-primary-key }}
